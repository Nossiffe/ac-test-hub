name: Snapshot and deploy

# Rebuilds the site with fresh data every hour, and on every push to main.
on:
  schedule:
    - cron: '17 * * * *' # UTC, off the top of the hour when GitHub is busiest
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      # Reads public data only. The workflow token raises the API limit to
      # 1,000 requests an hour; one snapshot needs about one per open PR.
      # If this step fails, nothing is deployed and the last site stays up.
      - name: Snapshot open pull requests
        run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
